<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17392f">
  <meta name="description" content="2026 年 11 月，琴平、祖谷、高知、宇和島、松山到高松的十二日秋季自駕旅帖。">
  <meta property="og:title" content="四國，秋日慢行">
  <meta property="og:description" content="SHIKOKU AUTUMN ROAD TRIP · 2026">
  <meta property="og:image" content="assets/cover.png">
  <title>四國，秋日慢行｜2026 四國自駕旅帖</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="hero">
    <img src="assets/cover.png" width="1728" height="910" alt="四國，秋日慢行｜SHIKOKU AUTUMN ROAD TRIP · 2026｜2026.11.16—11.27">
  </header>

  <main>
    <section id="schedule-section">
      <nav class="date-dock" aria-label="選擇旅行日期">
        <div id="date-rail" class="date-rail"></div>
      </nav>

      <section id="day-view" class="day-view" aria-live="polite"></section>
    </section>

    <section id="info-section" class="info-view" hidden>
      <header class="day-heading info-heading">
        <p>TRAVEL NOTES</p>
        <h1>其他資訊</h1>
        <span class="brush" aria-hidden="true"></span>
      </header>

      <section class="info-block">
        <p class="section-label">STAY</p>
        <h2>住宿一覽</h2>
        <div id="hotel-list" class="hotel-list"></div>
      </section>

      <section class="info-grid">
        <article><span>01</span><h2>航班</h2><p>11/16 抵達高松、11/27 返回台灣。航班編號與時間待補。</p></article>
        <article><span>02</span><h2>租車</h2><p>高松機場取還車。租車公司、據點與預約編號待補。</p></article>
        <article><span>03</span><h2>行程狀態</h2><p>楓紅色為已確認主線；金色標記代表可依天候、體力替換。</p></article>
        <article><span>04</span><h2>旅行提醒</h2><p>十一月山區日落早。祖谷、溪谷與下灘均以不摸黑駕駛為原則。</p></article>
      </section>

      <section class="memo">
        <p>尚待補入</p>
        <h2>航班時間、租車資料、餐廳預約與最終營業確認</h2>
        <span>這些資料確認後，可直接在 app.js 中更新，不影響其他畫面。</span>
      </section>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="主要導覽">
    <button id="schedule-nav" class="active" type="button"><span aria-hidden="true">日</span><b>日程</b></button>
    <button id="info-nav" type="button"><span aria-hidden="true">記</span><b>其他資訊</b></button>
  </nav>

  <div id="modal-backdrop" class="modal-backdrop" hidden>
    <section class="detail-sheet" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <button id="close-modal" class="close" type="button" aria-label="關閉詳細說明">×</button>
      <div class="sheet-handle" aria-hidden="true"></div>
      <p id="detail-eyebrow" class="sheet-eyebrow"></p>
      <div class="sheet-title">
        <h2 id="detail-title"></h2>
        <a id="detail-map" class="map-link" target="_blank" rel="noreferrer"><span aria-hidden="true">⌖</span>地圖</a>
      </div>
      <div id="detail-tags" class="sheet-tags"></div>
      <p id="detail-text" class="sheet-intro"></p>
<div class="sheet-rule"></div>
      <section id="detail-nearby" class="detail-extra" hidden>
  <h3>散步途中</h3>
  <div id="nearby-list"></div>
</section>
      <section id="detail-restaurants" class="detail-extra" hidden>
  <h3>餐廳選項</h3>
  <div id="restaurant-list"></div>
</section>
<h3>行程重點</h3>
<ul id="detail-highlights"></ul>
      <aside id="detail-note" hidden><b>旅程備註</b><p></p></aside>
      <button id="modal-done" class="sheet-done" type="button">返回</button>
    </section>
  </div>
</body>
</html>
